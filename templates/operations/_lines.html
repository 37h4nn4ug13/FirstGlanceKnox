<div class="table-wrap"><table><thead><tr><th>Service</th><th>Quantity</th><th class="text-right">Rate</th><th class="text-right">Amount</th></tr></thead><tbody>{% for line in document.lines.all %}<tr><td>{{ line.description }}</td><td>{{ line.quantity|floatformat:'-2' }} {{ line.unit }}</td><td class="text-right">${{ line.unit_price|floatformat:2 }}</td><td class="text-right">${{ line.total|floatformat:2 }}</td></tr>{% endfor %}</tbody></table></div>
