{% extends 'accounts/base.html' %}{% block account_content %}<span class="account-eyebrow">See you next time</span><h1>You're signed out.</h1><p>Your browser's offline crew data has been cleared and push notifications detached.</p><a class="account-action" href="{% url 'accounts:login' %}">Sign in again</a>{% endblock %}
{% block scripts %}{{ block.super }}<script>for(const key of Object.keys(localStorage)){if(key.startsWith('fgk-'))localStorage.removeItem(key)};if('caches' in window)caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('fgk-')).map(k=>caches.delete(k))));if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(items=>items.forEach(async item=>{const subscription=await item.pushManager?.getSubscription();if(subscription)await subscription.unsubscribe();item.active?.postMessage({type:'CLEAR_PRIVATE'})}));</script>{% endblock %}
