{% extends 'base.html' %}{% load static %}
{% block title %}Your account · FirstGlanceKnox{% endblock %}
{% block extra_head %}{{ block.super }}<style>.account-wrap{max-width:540px;margin:clamp(32px,6vw,80px) auto;padding:0 20px}.account-card{padding:clamp(24px,5vw,44px);background:#fff;border:1px solid #dbe3e7;border-radius:18px;box-shadow:0 16px 60px #172d3610}.account-eyebrow{font-size:.76rem;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:#1f7198}.account-card h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;margin:12px 0 20px}.account-card p{color:#50616a;line-height:1.65}.account-card form p{margin:18px 0}.account-card label{display:block;font-weight:650;margin-bottom:7px;color:#293237}.account-card input:not([type=checkbox]),.account-card select{width:100%;box-sizing:border-box;padding:13px 14px;min-height:48px;border:1px solid #adbcc4;border-radius:8px;font:inherit;font-size:16px}.account-card input[type=checkbox]{width:20px;height:20px;vertical-align:middle}.account-card button,.account-action{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border:0;border-radius:8px;background:#122f3a;color:#fff;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}.account-card a:not(.account-action){color:#155f82;text-underline-offset:3px}.account-card ul.errorlist{padding:12px 16px 12px 30px;color:#8b2330;background:#fff1f0;border-radius:8px}.account-card .helptext{display:block;font-size:.86rem;color:#64757e;margin-top:7px}.account-card :focus-visible{outline:3px solid #03a7fc;outline-offset:3px}.account-card .account-secondary{background:#edf3f5;color:#163c4b}.account-card .device-row{padding:15px 0;border-top:1px solid #dbe3e7}.account-card .device-row form{margin:8px 0}</style>{% endblock %}
{% block content %}<div class="account-wrap"><section class="account-card">{% block account_content %}{% endblock %}</section></div>{% endblock %}
